name: Force Sync 308 SKUs Everywhere

on:
  push:
    branches: [ main ]
    paths:
      - 'sync_all.py'
      - 'public/catalog.json'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  force-sync-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python sync_all.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Force sync 308 SKUs across all files"
          git push
