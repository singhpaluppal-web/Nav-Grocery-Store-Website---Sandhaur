name: Sync 308 SKUs
on:
  push:
    branches: [ main ]
    paths: [ 'sync_all.py', '.github/workflows/main.yml', 'public/catalog.json' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python sync_all.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Sync 308 SKUs"
          git push
