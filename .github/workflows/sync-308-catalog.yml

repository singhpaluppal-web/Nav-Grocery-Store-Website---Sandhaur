name: Sync 308 SKUs to HTML Storefront

on:
  push:
    branches: [ main ]
    paths:
      - 'public/catalog.json'
      - 'catalog.json'
      - '.github/workflows/sync-308-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog-to-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Replace hardcoded catalog array in all HTML files
        run: |
          python - << 'EOF'
          import json, os, re

          src = 'public/catalog.json' if os.path.exists('public/catalog.json') else 'catalog.json'
          data = json.load(open(src, encoding='utf-8'))
          items = data if isinstance(data, list) else data.get('products', [])
          by_id = { (x.get('id') or x.get('sku')): x for x in items if (x.get('id') or x.get('sku')) }

          targets = ['public.html', 'index.html', 'public/public.html', 'public/index.html']
          for fn in targets:
              if not os.path.exists(fn):
                  continue
              txt = open(fn, encoding='utf-8').read()
              orig = txt

              # 1. Replace entire JS array containing NAV001 and Aashirvaad Superior MP
              m = re.search(r'(\[\s*\{[^;]*?\bNAV001\b[^;]*?Aashirvaad Superior MP[^;]*?\}\s*\])', txt, flags=re.S)
              if m:
                  arr_json = json.dumps(items, ensure_ascii=False)
                  txt = txt[:m.start(1)] + arr_json + txt[m.end(1):]
                  print(f"Replaced full JS product array ({len(items)} SKUs) in {fn}")
              else:
                  # 2. Fallback: match any quote style (' " `) and key style around each SKU
                  for s, it in by_id.items():
                      nm = json.dumps(it.get('name') or it.get('title', ''))[1:-1]
                      br = json.dumps(it.get('brand', ''))[1:-1]
                      mr = int(float(it.get('mrp') or it.get('originalPrice', 100)))
                      pr = int(float(it.get('price') or it.get('salePrice') or round(mr * 0.88)))
                      txt = re.sub(r'(\b' + re.escape(s) + r'\b.{0,450}?["\']?(?:name|title)["\']?\s*:\s*["\'`])[^"\'`]*?(["\'`])', r'\g<1>' + nm + r'\g<2>', txt, flags=re.S)
                      txt = re.sub(r'(\b' + re.escape(s) + r'\b.{0,450}?["\']?brand["\']?\s*:\s*["\'`])[^"\'`]*?(["\'`])', r'\g<1>' + br + r'\g<2>', txt, flags=re.S)
                      txt = re.sub(r'(\b' + re.escape(s) + r'\b.{0,450}?["\']?(?:price|salePrice)["\']?\s*:\s*)\d+', r'\g<1>' + str(pr), txt, flags=re.S)
                      txt = re.sub(r'(\b' + re.escape(s) + r'\b.{0,450}?["\']?(?:mrp|originalPrice)["\']?\s*:\s*)\d+', r'\g<1>' + str(mr), txt, flags=re.S)

              # Also fix "306 verified grocery items" text to 308
              txt = txt.replace('306 verified grocery items', f'{len(items)} verified grocery items')

              if txt != orig:
                  open(fn, 'w', encoding='utf-8').write(txt)
                  print(f"SAVED UPDATED FILE: {fn}")
              else:
                  snip = re.search(r'.{0,180}Aashirvaad Superior MP.{0,180}', txt, flags=re.S)
                  print(f"DEBUG {fn}:", repr(snip.group(0)) if snip else "String not found")
          EOF

      - name: Commit and push synced HTML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public.html index.html public/public.html public/index.html 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-sync 308 SKUs into HTML storefront"
          git push
